# CyberStream — full local stack (Section 5, 57).
# Pinned image versions throughout — no ":latest" (Section 5 requirement).
# Two modes are configured via .env: DEV_MODE=1 (Section 58) reduces
# partitions/rate/dataset size for low-resource machines.

x-pg-env: &pg-env
  POSTGRES_USER: cyberstream
  POSTGRES_PASSWORD: cyberstream
  POSTGRES_DB: cyberstream

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cyberstream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cyberstream-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: cyberstream-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cyberstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16.4
    container_name: cyberstream-postgres
    environment: *pg-env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: cyberstream-spark
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: security-events
      KAFKA_CONSUMER_GROUP: cyberstream-spark
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      CHECKPOINT_DIR: /data/checkpoints
      PROCESSED_PATH: /data/processed
      ALERTS_PATH: /data/alerts
      DLQ_PATH: /data/dlq
      INCIDENTS_PATH: /data/incidents
    volumes:
      - ./data:/data

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    container_name: cyberstream-generator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: security-events
    command: [
      "--preset", "${GENERATOR_PRESET:-small}",
      "--scenario", "${GENERATOR_SCENARIO:-normal}",
      "--rate", "${GENERATOR_RATE:-200}",
      "--hosts", "${GENERATOR_HOSTS:-200}",
      "--users", "${GENERATOR_USERS:-500}",
      "--sink", "kafka"
    ]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberstream-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql://cyberstream:cyberstream@postgres:5432/cyberstream
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: security-events
      KAFKA_CONSUMER_GROUP: cyberstream-spark
      SPARK_UI_URL: http://spark:4040
      PROCESSED_PATH: /data/processed
      ALERTS_PATH: /data/alerts
      DLQ_PATH: /data/dlq
      INCIDENTS_PATH: /data/incidents
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberstream-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

  retention:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberstream-retention
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://cyberstream:cyberstream@postgres:5432/cyberstream
      RAW_PATH: /data/raw
      PROCESSED_PATH: /data/processed
      DLQ_PATH: /data/dlq
      RETENTION_RAW_DAYS: ${RETENTION_RAW_DAYS:-7}
      RETENTION_PROCESSED_DAYS: ${RETENTION_PROCESSED_DAYS:-14}
      RETENTION_ALERTS_DAYS: ${RETENTION_ALERTS_DAYS:-30}
      RETENTION_LOOP: "true"
      RETENTION_INTERVAL_SECONDS: 3600
    volumes:
      - ./data:/data
    entrypoint: ["python", "/app/scripts/retention_cleanup.py"]

volumes:
  pgdata:
